# Nom de l'application
spring.application.name=netvoyage
app.base-url=http://localhost:8088

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/netvoyage?createDatabaseIfNotExist=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

### JWT ###
jwt.secret=enU3THMH++zCHyM64UtvshLcPCadhtaB3NTSMVuV8pI=

### SPRING BATCH ###
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

### SPRING MVC ###
spring.mvc.dispatch-options-request=true
spring.web.resources.static-locations=file:./public/

### SERVER ###
server.port=8088

### LOGGING ###
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.tn.fst.spring=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.tn.fst.spring.netvoyage.services.implementations.EmailService=TRACE

### SÉCURITÉ ###
# Désactive la sécurité Spring Boot par défaut (à utiliser uniquement si tu gères la sécu manuellement)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

### FICHIERS TEMPORAIRES / UPLOAD ###
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

